<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --bg: #07080b;
      --accent: #2af6ff;
      --accent-2: #ffd166;
      --text: #eaf2f2;
      --muted: #93a6b5;
      --danger: #ff6b6b;
      --font-tech: "Space Grotesk", "Sora", "Avenir Next", "Futura", "Gill Sans", "Trebuchet MS", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      width: 280px;
      height: 440px;
      margin: 0;
      background:
        radial-gradient(circle at 20% 20%, rgba(42, 246, 255, 0.18), transparent 45%),
        radial-gradient(circle at 80% 10%, rgba(255, 209, 102, 0.15), transparent 45%),
        linear-gradient(160deg, #050607 0%, #0a1220 60%, #050607 100%);
      color: var(--text);
      font-family: var(--font-tech);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 22px;
      box-sizing: border-box;
    }
    h1 {
      font-weight: 600;
      letter-spacing: 0.4em;
      margin-bottom: 26px;
      text-transform: uppercase;
      font-size: 1.1rem;
      color: var(--accent);
    }
    .btn {
      background: rgba(8, 12, 18, 0.8);
      border: 1px solid rgba(42, 246, 255, 0.4);
      color: var(--accent);
      padding: 12px 18px;
      margin: 8px 0;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      transition: 0.2s ease;
      width: 100%;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
    }
    .btn:hover {
      background: rgba(42, 246, 255, 0.15);
      border-color: var(--accent);
      transform: translateY(-1px);
    }
    .btn-danger {
      border-color: rgba(255, 107, 107, 0.6);
      color: var(--danger);
    }
    .btn-danger:hover {
      background: rgba(255, 107, 107, 0.15);
      border-color: var(--danger);
    }
    .status {
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 6px;
    }
    .status.error { color: var(--danger); }
    .logo-container {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
    }
    .logo-icon {
      width: 235px;
      height: auto;
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <img src="icons/513d19b9-d3db-435d-bd2a-c31d8b8d5097.png" alt="AuDioPrism" class="logo-icon">
  </div>
  <button id="btnStart" class="btn">Activate System</button>
  <button id="btnStop" class="btn btn-danger">Deactivate System</button>
  <div class="status" id="status-text">Neuro Acoustic Focus</div>
  <script src="popup.js"></script>
</body>
</html>
