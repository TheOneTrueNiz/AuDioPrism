<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --md-primary: #c084fc;
      --md-on-primary: #2a1248;
      --md-accent: #5ee9f2;
      --md-on-surface: #f4f0fb;
      --md-on-variant: #c4b8d4;
      --md-error: #ffb4ab;
      --font: "Roboto", "YouTube Sans", "Segoe UI", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html { background: transparent; }
    body {
      width: 280px;
      margin: 0;
      padding: 18px 18px 16px;
      background:
        radial-gradient(circle at 12% 0%, rgba(192, 132, 252, 0.28), transparent 50%),
        radial-gradient(circle at 100% 0%, rgba(94, 233, 242, 0.08), transparent 42%),
        rgba(8, 5, 14, 0.78);
      color: var(--md-on-surface);
      font-family: var(--font);
      backdrop-filter: blur(32px) saturate(1.6);
      -webkit-backdrop-filter: blur(32px) saturate(1.6);
    }
    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 6px;
    }
    .brand img {
      width: 36px;
      height: 36px;
      object-fit: contain;
      filter: drop-shadow(0 0 8px rgba(192, 132, 252, 0.5));
    }
    .brand-word {
      font-size: 20px;
      font-weight: 750;
      letter-spacing: 0.01em;
      line-height: 1;
      background: linear-gradient(90deg, #e9d5ff 0%, #c084fc 40%, #e879f9 72%, #5ee9f2 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .brand-word span { font-weight: 650; }
    .eyebrow {
      margin: 0 0 10px;
      font-size: 10px;
      font-weight: 650;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      text-align: center;
      color: var(--md-on-variant);
    }
    .status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin: 0 0 14px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--md-on-variant);
    }
    .status .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #6b7780;
    }
    .status.live { color: var(--md-accent); }
    .status.live .dot {
      background: var(--md-accent);
      box-shadow: 0 0 8px var(--md-accent);
    }
    .status.error { color: var(--md-error); }
    .status.error .dot { background: var(--md-error); }
    .btn {
      display: block;
      width: 100%;
      height: 40px;
      margin: 0 0 10px;
      border: none;
      border-radius: 20px;
      font: 600 14px var(--font);
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: transform 0.15s, background 0.15s, box-shadow 0.15s;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn:focus-visible { outline: 2px solid var(--md-accent); outline-offset: 2px; }
    .btn-primary {
      background: linear-gradient(180deg, #d4b4ff, var(--md-primary));
      color: var(--md-on-primary);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), 0 4px 18px rgba(192, 132, 252, 0.32);
    }
    .btn-primary:hover { background: #e9d5ff; }
    .btn-stop {
      background: transparent;
      color: var(--md-error);
      border: 1px solid color-mix(in srgb, var(--md-error) 55%, transparent);
    }
    .btn-stop:hover { background: rgba(255, 180, 171, 0.1); }
    .hint {
      margin: 4px 0 0;
      text-align: center;
      font-size: 11px;
      line-height: 1.45;
      color: var(--md-on-variant);
    }
  </style>
</head>
<body>
  <div class="brand">
    <img src="icons/prism-icon.png" alt="">
    <div class="brand-word">Au<span>Dio</span>Prism</div>
  </div>
  <p class="eyebrow">Spatial audio mixer</p>
  <div class="status" id="status-text"><span class="dot"></span><span id="status-label">Idle</span></div>
  <button id="btnStart" class="btn btn-primary" type="button">Open mixer</button>
  <button id="btnStop" class="btn btn-stop" type="button">Stop engine</button>
  <p class="hint" id="hint">Open YouTube Music, Spotify, or Apple Music in this tab.</p>
  <script src="popup.js"></script>
</body>
</html>
